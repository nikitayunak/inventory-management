{% extends "layout.html" %}
{% block title %}
  Login
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <a href="{% url 'register' %}"> Don't have an account? Register here.</a>
    </div>
{% endblock %}
